<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Gmail 寄送預覽</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    font-family: "Microsoft JhengHei UI", sans-serif; }
  .toolbar { padding: 14px 24px; background: #fff;
    border-bottom: 1px solid var(--border); display: flex; gap: 8px;
    align-items: center; flex-wrap: wrap; }
  .toolbar input { padding: 8px 12px; border: 1px solid var(--border-strong);
    border-radius: 6px; flex: 1; min-width: 240px; font-family: monospace; }
  .btn { padding: 7px 14px; border: 1px solid var(--border-strong);
    border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  .btn-success { background: #16a34a; color: #fff; border-color: #16a34a; }
  .btn-success:disabled { opacity: .5; cursor: not-allowed; }
  .table-wrap { flex: 1; overflow: auto; padding: 16px 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border);
    text-align: left; }
  th { background: var(--surface-2); font-weight: 600; position: sticky; top: 0; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill-pending { background: #fef3c7; color: #92400e; }
  .pill-sent { background: #dcfce7; color: #166534; }
  .pill-failed { background: #fee2e2; color: #991b1b; }
  .pill-skipped { background: #e5e7eb; color: #374151; }
  .err-line { font-size: 10px; color: #dc2626; margin-top: 2px; }
</style>
</head>
<body>
<div class="app-header">
  <div>
    <span class="app-title">📧 Gmail 寄送預覽</span>
    <span class="app-version" id="senderShow"></span>
  </div>
  <div class="app-org" id="counts"></div>
</div>

<div class="toolbar">
  <button class="btn" onclick="setAll(true)">全選</button>
  <button class="btn" onclick="setAll(false)">全不選</button>
  <button class="btn" onclick="setSendable()">僅選可寄送</button>
  <span style="font-size:12px;color:var(--text-dim);" id="selCount"></span>
  <input type="password" id="appPw" placeholder="Gmail App Password (16 碼)">
  <button class="btn btn-success" id="sendBtn" onclick="doSend()" disabled>📤 寄出</button>
</div>

<div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th style="width:32px;">☑</th>
        <th>區別</th><th>姓名</th><th>角色</th><th>診所</th>
        <th>Email</th><th>附件</th><th>狀態</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
let JOBS = [];
let SENDER = '';

const py = new Proxy({}, {
  get: (_, name) => async (...args) => {
    const r = await fetch("/api/" + name, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ args }),
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.err || "API 呼叫失敗");
    return j.result;
  },
});

function render() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  JOBS.forEach((j, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="checkbox" ${j.selected ? 'checked' : ''}
          onchange="toggle(${i})"></td>
      <td>${j.zone || ''}</td>
      <td>${j.person_name || ''}</td>
      <td>${j.role || ''}</td>
      <td>${j.clinic_name || ''}</td>
      <td style="font-family:monospace;font-size:11px;">${j.to_email || ''}</td>
      <td>${j.attachments_count}</td>
      <td>
        <span class="pill pill-${j.status}">
          ${ {pending:'待寄', sent:'✓ 已寄', failed:'✕ 失敗', skipped:'略過'}[j.status] || j.status }
        </span>
        ${j.error ? `<div class="err-line">${j.error}</div>` : ''}
      </td>`;
    tbody.appendChild(tr);
  });
  const counts = { pending: 0, sent: 0, failed: 0, skipped: 0 };
  JOBS.forEach((j) => counts[j.status] = (counts[j.status] || 0) + 1);
  const selCount = JOBS.filter((j) => j.selected).length;
  document.getElementById('counts').textContent
    = `共 ${JOBS.length} · 待寄 ${counts.pending} · 已寄 ${counts.sent} · 失敗 ${counts.failed}`;
  document.getElementById('selCount').textContent = `已勾 ${selCount}`;
  document.getElementById('sendBtn').textContent = `📤 寄出 ${selCount} 封`;
  updateBtn();
}
function toggle(i) { JOBS[i].selected = !JOBS[i].selected; render(); }
function setAll(v) { JOBS.forEach((j) => j.selected = v); render(); }
function setSendable() {
  JOBS.forEach((j) => { j.selected = j.status === 'pending' && !!j.to_email && j.attachments_count > 0; });
  render();
}
function updateBtn() {
  const ok = document.getElementById('appPw').value.trim()
    && JOBS.some((j) => j.selected);
  document.getElementById('sendBtn').disabled = !ok;
}

async function doSend() {
  const pw = document.getElementById('appPw').value;
  const indices = JOBS.map((j, i) => j.selected ? i : -1).filter((i) => i >= 0);
  if (indices.length === 0) return alert('沒有勾選');
  if (!confirm(`確定寄送 ${indices.length} 封？`)) return;
  document.getElementById('sendBtn').disabled = true;
  try {
    const r = await py.sendBatch(pw, indices);
    JOBS = r.jobs;
    render();
    alert(`完成：成功 ${r.sent} 封 / 失敗 ${r.failed} 封`);
  } catch (e) { alert('失敗：' + e.message); }
}

document.getElementById('appPw').addEventListener('input', updateBtn);

(async () => {
  const d = await py.getEmailData();
  JOBS = d.jobs;
  SENDER = d.sender;
  document.getElementById('senderShow').textContent = SENDER;
  render();
})();
</script>
</body>
</html>
